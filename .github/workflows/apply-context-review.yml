            "challengeBurntGatherGearDesc": "Некоторые предметы помогут вам лучше выживать. Соберите их и выполните все испытания в Сгоревшем лесу, чтобы получить дополнительную награду в 10000 опыта"
          }""")

          def parse_value(rest):
              if rest.startswith('"') and rest.endswith('"'):
                  return rest[1:-1].replace('""', '"')
              return rest

          def quote(value):
              return '"' + value.replace('"', '""') + '"'

          def tokens(value):
              placeholders = re.findall(r'\{[^{}]+\}', value)
              colors = re.findall(r'\[[0-9A-Fa-f]{6,8}\]|\[-\]', value)
              actions = re.findall(r'\[action:[^\]]+\]', value)
              return placeholders, colors, actions, value.count(r'\n')

          en_values = {}
          for line in EN.read_text(encoding='utf-8-sig').splitlines()[2:]:
              if not line or ',' not in line:
                  continue
              key, rest = line.split(',', 1)
              en_values.setdefault(key, parse_value(rest))

          raw = RU.read_text(encoding='utf-8-sig')
          lines = raw.splitlines()
          out = []
          changed = set()
          in_tail = False

          for line in lines:
              if line.startswith(MARKER + ','):
                  in_tail = True
              if not in_tail and ',' in line:
                  key, _ = line.split(',', 1)
                  if key in CHANGES:
                      if key not in en_values:
                          raise SystemExit(f'Missing English key: {key}')
                      if tokens(CHANGES[key]) != tokens(en_values[key]):
                          raise SystemExit(f'Structure mismatch for {key}: EN={tokens(en_values[key])} RU={tokens(CHANGES[key])}')
                      line = key + ',' + quote(CHANGES[key])
                      changed.add(key)
              out.append(line)

          missing = set(CHANGES) - changed
          if missing:
              raise SystemExit('Keys not updated: ' + ', '.join(sorted(missing)))

          result = ('\n'.join(out) + '\n').encode('utf-8')
          blob = hashlib.sha1(b'blob ' + str(len(result)).encode() + b'\0' + result).hexdigest()
          if blob != EXPECTED_BLOB:
              raise SystemExit(f'Unexpected result blob {blob}, expected {EXPECTED_BLOB}')

          RU.write_bytes(result)
          print(f'Updated {len(changed)} contextual translations')
          print(f'Validated Git blob: {blob}')
          PYCODE

      - name: Commit to main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-context-review.yml
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt
          git commit -m "Contextual QA for Russian localization"
          git push origin HEAD:main
