name: Apply latest localization sync with value audit

on:
  push:
    paths:
      - .github/workflows/apply-20260912-localization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit English changes and update Russian
        shell: python
        run: |
          from pathlib import Path
          from collections import defaultdict, deque, Counter
          import re
          import subprocess

          en_path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/English.txt')
          ru_path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt')
          BASE = '8734c5035eeae56be97b9c1de0a69a578be0826a'
          EXPECTED_EN_BLOB = '1d1eb17c290fa9538a07c1fdef1f1dc894d88ded'
          EXPECTED_RU_BLOB = 'bd7c9cfa95aae764747e8dbbad3efda256d56a85'

          def blob_sha(path):
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          if blob_sha(en_path) != EXPECTED_EN_BLOB:
              raise SystemExit('English.txt changed while this update was being prepared')
          if blob_sha(ru_path) != EXPECTED_RU_BLOB:
              raise SystemExit('Russian.txt changed while this update was being prepared')

          def records(data):
              out = []
              for line in data.decode('utf-8-sig').splitlines():
                  if not line or ',' not in line:
                      continue
                  key, value = line.split(',', 1)
                  if key == 'Key':
                      continue
                  out.append((key, value))
              return out

          old_en = subprocess.check_output(['git', 'show', f'{BASE}:{en_path.as_posix()}'])
          new_en = en_path.read_bytes()
          old_records = records(old_en)
          new_records = records(new_en)

          def grouped(rows):
              m = defaultdict(list)
              for k, v in rows:
                  m[k].append(v)
              return m

          old_map = grouped(old_records)
          new_map = grouped(new_records)
          old_keys = set(old_map)
          new_keys = set(new_map)
          added = new_keys - old_keys
          removed = old_keys - new_keys
          changed = {k for k in old_keys & new_keys if old_map[k] != new_map[k]}

          expected_added = {
              'xuiChooseThree', 'xuiChooseFour', 'xuiChooseFive', 'xuiChooseRewards',
              'uiResearchMissing',
              'ulmBuffSheltered', 'ulmBuffShelteredDesc',
              'shapeVariantHelper', 'woodShapes:VariantHelper', 'cobblestoneShapes:VariantHelper',
              'brickShapes:VariantHelper', 'concreteShapes:VariantHelper', 'steelShapes:VariantHelper',
              'challengeGathererIron', 'challengeGathererIronShort', 'challengeGathererIronDesc',
              'challengeGathererLead', 'challengeGathererLeadShort', 'challengeGathererLeadDesc',
              'challengeGathererStone', 'challengeGathererStoneShort', 'challengeGathererStoneDesc',
          }
          expected_removed = {'ConcreteShapes:VariantHelper'}
          expected_changed = {'rConcreteShapes:VariantHelper'}

          if added != expected_added:
              raise SystemExit(f'Unexpected added English keys: expected {sorted(expected_added)}, got {sorted(added)}')
          if removed != expected_removed:
              raise SystemExit(f'Unexpected removed English keys: expected {sorted(expected_removed)}, got {sorted(removed)}')
          if changed != expected_changed:
              raise SystemExit(f'Unexpected changed English values: expected {sorted(expected_changed)}, got {sorted(changed)}')

          overrides = {
              'xuiChooseThree': 'Выберите три:',
              'xuiChooseFour': 'Выберите четыре:',
              'xuiChooseFive': 'Выберите пять:',
              'xuiChooseRewards': 'Выберите награды:',
              'uiResearchMissing': 'Вы не исследовали [73E9B2]{0}[-]',
              'ulmBuffSheltered': 'В укрытии',
              'ulmBuffShelteredDesc': r'Вы находитесь в укрытии.\n\nСопротивление жаре и холоду [decea3]+10[-]',

              'shapeVariantHelper': 'Формы',
              'awningShapes:VariantHelper': 'Формы навесов',
              'corrugatedMetalShapes:VariantHelper': 'Формы из гофрированного металла',
              'frameShapes:VariantHelper': 'Формы деревянного каркаса',
              'woodShapes:VariantHelper': 'Деревянные формы',
              'cobblestoneShapes:VariantHelper': 'Формы из булыжника',
              'brickShapes:VariantHelper': 'Кирпичные формы',
              'titaniumShapes:VariantHelper': 'Титановые формы',
              'concreteShapes:VariantHelper': 'Бетонные формы',
              'rConcreteShapes:VariantHelper': 'Железобетонные формы',
              'steelShapes:VariantHelper': 'Стальные формы',

              'challengeGathererIron': 'Добудьте [decea3]железную руду[-]',
              'challengeGathererIronShort': 'Добудьте немного [decea3]железной руды[-]',
              'challengeGathererIronDesc': 'Железо — плотный и прочный материал, используемый для изготовления предметов в [decea3]кузнице[-], но сначала руду нужно переработать в [decea3]горне[-], чтобы выплавить [decea3]слитки[-]. Его можно добывать [decea3]киркой[-], [decea3]отбойным молотком[-] или [decea3]буром Валькирии[-] из таких источников, как [decea3]железные рудные валуны[-] или выходящие на поверхность жилы [decea3]железной руды[-].',
              'challengeGathererLead': 'Добудьте [decea3]свинцовую руду[-]',
              'challengeGathererLeadShort': 'Добудьте немного [decea3]свинцовой руды[-]',
              'challengeGathererLeadDesc': 'Свинец — очень плотный материал, используемый для изготовления предметов в [decea3]кузнице[-], но сначала руду нужно переработать в [decea3]горне[-], чтобы выплавить [decea3]слитки[-]. Его можно добывать [decea3]киркой[-], [decea3]отбойным молотком[-] или [decea3]буром Валькирии[-] из таких источников, как [decea3]свинцовые рудные валуны[-] или выходящие на поверхность жилы [decea3]свинцовой руды[-].',
              'challengeGathererStone': 'Добудьте [decea3]крупный камень[-]',
              'challengeGathererStoneShort': 'Добудьте немного [decea3]крупного камня[-]',
              'challengeGathererStoneDesc': 'Камень — базовый ресурс, используемый в строительстве и изготовлении предметов. [decea3]Крупный камень[-] можно добывать [decea3]киркой[-], [decea3]отбойным молотком[-] или [decea3]буром Валькирии[-] из таких источников, как [decea3]каменные валуны[-] или выходящие на поверхность залежи [decea3]камня[-].',
          }

          tag_re = re.compile(r'\[[^\]]+\]')
          placeholder_re = re.compile(r'\{[^{}]+\}')
          number_re = re.compile(r'(?<![\w])[-+]?\d+(?:\.\d+)?%?')

          def unquote(v):
              return v[1:-1] if len(v) >= 2 and v.startswith('"') and v.endswith('"') else v

          def signature(v):
              v = unquote(v)
              tags = Counter(tag_re.findall(v))
              placeholders = Counter(placeholder_re.findall(v))
              scrubbed = tag_re.sub('', v)
              scrubbed = placeholder_re.sub('', scrubbed)
              numbers = Counter(number_re.findall(scrubbed))
              return tags, placeholders, numbers, v.count(r'\n')

          for key in overrides:
              if key not in new_map or len(new_map[key]) != 1:
                  raise SystemExit(f'Expected exactly one current English value for translated key {key}')
              en_sig = signature(new_map[key][0])
              ru_sig = signature(f'"{overrides[key]}"')
              if en_sig != ru_sig:
                  raise SystemExit(f'Token mismatch for {key}: EN={en_sig}, RU={ru_sig}')

          ru_data = ru_path.read_bytes()
          bom = b'\xef\xbb\xbf' if ru_data.startswith(b'\xef\xbb\xbf') else b''
          body = ru_data[len(bom):]
          lines = body.splitlines(keepends=True)
          nl = b'\r\n' if any(line.endswith(b'\r\n') for line in lines[:20]) else b'\n'

          marker = b'DOWN_VANILA_FIX_REMEBER_COPY,'
          tail_idx = next((i for i, line in enumerate(lines) if line.startswith(marker)), None)
          if tail_idx is None:
              raise SystemExit('Protected override marker not found')
          protected_tail = b''.join(lines[tail_idx:])

          def key_of(line):
              raw = line.rstrip(b'\r\n')
              if not raw or b',' not in raw:
                  return None
              return raw.split(b',', 1)[0].decode('utf-8-sig')

          prefix = []
          queues = defaultdict(deque)
          seen_first_data = False
          for line in lines[:tail_idx]:
              key = key_of(line)
              if key == 'Key' or (not seen_first_data and key is None):
                  prefix.append(line)
                  continue
              if key is None:
                  raise SystemExit('Unexpected non-record line in Russian main localization body')
              seen_first_data = True
              queues[key].append(line)

          def encode_line(key, value):
              if '"' in value:
                  raise SystemExit(f'Unexpected quote in prepared translation: {key}')
              return f'{key},"{value}"'.encode('utf-8') + nl

          out = list(prefix)
          for key, _value in new_records:
              if key in overrides:
                  if queues[key]:
                      queues[key].popleft()
                  out.append(encode_line(key, overrides[key]))
              else:
                  if not queues[key]:
                      raise SystemExit(f'No Russian line available for current English key: {key}')
                  out.append(queues[key].popleft())

          leftovers = []
          for key, q in queues.items():
              leftovers.extend([key] * len(q))
          if Counter(leftovers) != Counter({'ConcreteShapes:VariantHelper': 1}):
              raise SystemExit(f'Unexpected leftover Russian keys after alignment: {leftovers}')

          new_ru = bom + b''.join(out) + protected_tail
          if not new_ru.endswith(protected_tail):
              raise SystemExit('Protected override tail changed')
          ru_path.write_bytes(new_ru)

          ru_main_keys = []
          for line in ru_path.read_bytes().decode('utf-8-sig').splitlines()[1:]:
              if line.startswith('DOWN_VANILA_FIX_REMEBER_COPY,'):
                  break
              if line and ',' in line:
                  ru_main_keys.append(line.split(',', 1)[0])
          en_key_sequence = [k for k, _ in new_records]
          if ru_main_keys != en_key_sequence:
              raise SystemExit('Russian main key sequence does not exactly match current English')

          print(f'English semantic diff since {BASE[:12]}: +{len(added)} / -{len(removed)} / changed values {len(changed)}')
          print('Changed existing English keys:', ', '.join(sorted(changed)))
          print('Token audit passed: numbers, percentages, placeholders, markup tags and \\n are preserved.')

      - name: Commit translation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-20260912-localization.yml
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt
          git commit -m "Sync Russian localization with latest English"
          git push origin HEAD:main
