name: Apply latest English localization sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-english-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Russian localization with latest English
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          en_path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/English.txt')
          ru_path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt')
          marker = 'DOWN_VANILA_FIX_REMEBER_COPY'

          en_text = en_path.read_text(encoding='utf-8-sig')
          ru_text = ru_path.read_text(encoding='utf-8-sig')
          en_lines = en_text.splitlines()
          ru_lines = ru_text.splitlines()

          marker_index = next((i for i, line in enumerate(ru_lines) if line.startswith(marker + ',')), None)
          if marker_index is None:
              raise SystemExit('Protected override marker not found')

          main = ru_lines[:marker_index]
          tail = ru_lines[marker_index:]
          original_tail = list(tail)

          remove_keys = {'ulmResourceSolarPanel', 'ulmResourceSolarPanelDesc'}
          new_main = []
          inserted = False
          seen_loading = False

          for line in main:
              if not line.strip() or ',' not in line:
                  new_main.append(line)
                  continue
              key = line.split(',', 1)[0]
              if key in remove_keys:
                  continue
              if key == 'uiLoadingSkills':
                  seen_loading = True
                  new_main.append('uiLoadingSkills,"Загрузка данных дерева навыков..."')
                  inserted = True
                  continue
              new_main.append(line)
              if key == 'uiLightToggle' and not seen_loading:
                  new_main.append('uiLoadingSkills,"Загрузка данных дерева навыков..."')
                  inserted = True

          if not inserted:
              raise SystemExit('Could not insert uiLoadingSkills')

          def keys(lines, skip_header=False):
              out = []
              start = 1 if skip_header else 0
              for line in lines[start:]:
                  if not line.strip():
                      continue
                  if ',' not in line:
                      raise SystemExit(f'Malformed localization row: {line!r}')
                  out.append(line.split(',', 1)[0].lstrip('\ufeff'))
              return out

          en_keys = keys(en_lines, skip_header=True)
          ru_keys = keys(new_main, skip_header=True)
          if ru_keys != en_keys:
              for i, (e, r) in enumerate(zip(en_keys, ru_keys), start=1):
                  if e != r:
                      raise SystemExit(f'Key order mismatch at data row {i}: EN={e!r} RU={r!r}')
              raise SystemExit(f'Key count mismatch: EN={len(en_keys)} RU={len(ru_keys)}')

          if tail != original_tail:
              raise SystemExit('Protected override tail changed unexpectedly')

          out = '\n'.join(new_main + tail) + '\n'
          ru_path.write_text(out, encoding='utf-8', newline='\n')

          print(f'English rows: {len(en_keys)}')
          print(f'Russian aligned rows: {len(ru_keys)}')
          print(f'Protected tail rows: {len(tail)}')
          print('Added: uiLoadingSkills')
          print('Removed: ulmResourceSolarPanel, ulmResourceSolarPanelDesc')
          PY

      - name: Commit synchronized Russian file and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-english-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt .github/workflows/apply-english-sync.yml
          git diff --cached --check
          git commit -m "Sync Russian localization with latest English"
          git push origin HEAD:main
