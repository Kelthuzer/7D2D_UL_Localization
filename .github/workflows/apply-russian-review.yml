name: Apply Russian localization review

on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-russian-review.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed translations
