          'resourceFishingWeightDesc':'Свинцовые предметы можно переработать в лом свинца в [decea3]Переработчике[-].','resourceLegendaryPartsDesc':'Хорошо сохранившиеся заводские детали высшего качества, которые можно использовать для улучшения предметов до максимального качества.','ulmAmmo50CalRoundSTDesc':'.50 Cal [decea3]стандартные[-] патроны, обычно используемые в [decea3]снайперских винтовках[-].','ulmStorageWoodChest3SecureDesc':r'[decea3]Можно запереть.[-]\nПрочный сундук из дерева.','ulmArmorFirefighterHelmetRusty':'Пожарный шлем (ржавый)','ulmArmorHardHatYellow':'Строительная каска (жёлтая)',
