          'perkSniperAPAmmoDesc':'Создание боеприпасов [decea3]AP 7.92мм[-].','perkSniperAPAmmoLongDesc':'Обучает изготовлению боеприпасов [decea3]AP 7.92мм[-].','perkSniperHPAmmoDesc':'Создание боеприпасов [decea3]HP 7.92мм[-].','perkSniperHPAmmoLongDesc':'Обучает изготовлению боеприпасов [decea3]HP 7.92мм[-].',
