          'deco_remnant_wood_02':'Руины деревянного дома 1','utility_celltower_02':'Вышка сотовой связи 2','remnant_waste_04':'Разрушенная кофейня Zip-Coffee','remnant_waste_06':'Разрушенный офис Eye Kandy','office_02':'Офис Rise Realty','oldwest_strip_04':'Металлообработка','oldwest_watertower':'Старая водонапорная башня','parking_garage_01':'Паркинг','parking_garage_02':'Паркинг Buy N Go','ranger_station_01':'Станция рейнджеров 1','ranger_station_02':'Станция рейнджеров 2','ranger_station_03':'Станция рейнджеров 3','ranger_station_04':'Станция рейнджеров 4','ranger_station_05':'Станция рейнджеров 5','ranger_station_06':'Станция рейнджеров 6','ranger_station_07':'Станция рейнджеров 7','store_grocery_03':'Продуктовый магазин Buy N Go','factory_lg_02':'Завод Shotgun Messiah','remnant_waste_15':'Разрушенный склад JD Shipping',
          'tankPropaneWhite':'Белый газовый баллон','tankPropaneWhiteDesc':'Используется для хранения газов.','tankPropaneBrown':'Коричневый газовый баллон','tankPropaneBrownDesc':'Используется для хранения газов.','tankPropaneRed':'Красный газовый баллон','tankPropaneRedDesc':'Используется для хранения газов.','tankPropaneOrange':'Оранжевый газовый баллон','tankPropaneOrangeDesc':'Используется для хранения газов.','tankPropaneYellow':'Жёлтый газовый баллон','tankPropaneYellowDesc':'Используется для хранения газов.','tankPropaneGreen':'Зелёный газовый баллон','tankPropaneGreenDesc':'Используется для хранения газов.','tankPropaneBlue':'Синий газовый баллон','tankPropaneBlueDesc':'Используется для хранения газов.','tankPropaneGrey':'Серый газовый баллон','tankPropaneGreyDesc':'Используется для хранения газов.','tankPropanePink':'Розовый газовый баллон','tankPropanePinkDesc':'Используется для хранения газов.',
          'shippingContainerDoorsClosedWhite':'Белые закрытые двери грузового контейнера','shippingContainerDoorFrameWhite':'Белая дверная рама грузового контейнера','shippingContainerDoorLeftOpenWhite':'Белая левая открытая дверь грузового контейнера','shippingContainerDoorLeftRotatedWhite':'Белая левая повёрнутая дверь грузового контейнера','shippingContainerDoorRightOpenWhite':'Белая правая открытая дверь грузового контейнера','shippingContainerSideWhite':'Белая боковая стенка грузового контейнера','shippingContainerSideTextWhite':'Белая боковая стенка грузового контейнера с текстом','shippingContainerSideHoleWhite':'Белая боковая стенка грузового контейнера с отверстием','shippingContainerCapWhite':'Белая торцевая часть грузового контейнера',
          'ulmDoorIndustrial03bSingle':'Промышленная дверь 3-B','ulmDoorIndustrial03bSingleNoGlass':'Промышленная дверь 3-B','ulmDoorIndustrial12bSingle':'Промышленная дверь 12-B','ulmDoorIndustrial12bSingleNoGlass':'Промышленная дверь 12-B','ulmDoorIndustrial12cSingle':'Промышленная дверь 12-C','ulmDoorIndustrial12cSingleNoGlass':'Промышленная дверь 12-C',
          'cntCabinetOldBottomLootHelper':'Старый шкаф | Случайный вариант','cntGarageRandomLootHelper':'Гаражная добыча | Случайный вариант','cntLockersShortRandomLootHelper':'Низкие шкафчики | Случайный вариант','cntLockersTallRandomLootHelper':'Высокие шкафчики | Случайный вариант','cntLockersTallDoubleRandomLootHelper':'Высокие двойные шкафчики | Случайный вариант','cntLockersTallMixRandomLootHelper':'Смешанные шкафчики 1 | Случайный вариант','cntLockersTallMixLinkRandomLootHelper':'Смешанные шкафчики 2 | Случайный вариант','cntLuggagePileARandomLootHelper':'Куча багажа A | Случайный вариант','cntLuggagePileBRandomLootHelper':'Куча багажа B | Случайный вариант','cntShoesPileRandomLootHelper':'Куча обуви | Случайный вариант','cntWasherIndustrialRandomLootHelper':'Промышленная стиральная машина | Случайный вариант','cntWastelandRandomLootHelper':'Добыча пустоши | Случайный вариант','cntWoodDesk01RandomLootHelper':'Деревянный стол | Случайный вариант',
          'uiLockpickingInsufficient':'Ваш уровень взлома [FF1919]{0}[-] недостаточно высок для взлома замка уровня [decea3]{1}[-].','uiUpgradeMax':'Дальнейшие улучшения невозможны','animalBossGrace':'Мутировавший гигантский кабан','typeRocketLaunchers':'Ракетница',
          'ulmEquippingItemBlocked':'Нельзя экипировать: {0} запрещает экипировку этого предмета.','uiRequiresItem':'Требуется предмет [73E9B2]{0}[-]','foodBurntSmoothie':'Сыворотка «Чёрные лёгкие»','foodBurntSmoothieDesc':'Частично помогает вылечить инфекцию лёгких и повышает скорость передвижения в биоме сгоревшего леса.','foodOasisSmoothie':'Тоник от солнечного удара','foodOasisSmoothieDesc':'Повышает сопротивление жаре и скорость передвижения в пустыне.','foodFrostbiteSmoothie':'Обжигающее рагу','foodFrostbiteSmoothieDesc':'Повышает сопротивление холоду и скорость передвижения в снежном биоме.','foodAtomicSmoothie':'Очищение от радиации','foodAtomicSmoothieDesc':'Повышает сопротивление холоду и жаре, а также скорость передвижения в пустоши.','challengeBurntGatherGear':'Соберите ресурсы в сгоревшем биоме','challengeBurntGatherGearShort':'Соберите несколько ресурсов в сгоревшем биоме','challengeBurntGatherGearDesc':'Некоторые предметы помогут вам лучше выживать. Соберите их и выполните все испытания в сгоревшем биоме, чтобы получить дополнительную награду в 10000 опыта'
          }

          def parse(line):
              if not line or ',' not in line: return None
              k,v=line.split(',',1)
              if len(v)>=2 and v[0]=='"' and v[-1]=='"': v=v[1:-1]
              return k,v
          def mk(k,v):
              if '"' in v: raise RuntimeError(k)
              return f'{k},"{v}"'

          en_lines=EN.read_text(encoding='utf-8-sig').splitlines()
          ru_lines=RU.read_text(encoding='utf-8-sig').splitlines()
          ti=next(i for i,l in enumerate(ru_lines) if l.startswith('DOWN_VANILA_FIX_REMEBER_COPY,'))
          tail=ru_lines[ti:]
          q=defaultdict(deque)
          for l in ru_lines[:ti]:
              p=parse(l)
              if p and p[0]!='Key': q[p[0]].append(l)
          er=[]; nm=['Key,russian','']
          for l in en_lines:
              p=parse(l)
              if not p or p[0]=='Key': continue
              k,e=p; er.append((k,e))
              if k in R: nm.append(mk(k,R[k]))
              elif q[k]: nm.append(q[k].popleft())
              else: raise RuntimeError('Missing Russian: '+k)
          rr=[parse(l) for l in nm if parse(l) and parse(l)[0]!='Key']
          if len(er)!=7287 or len(rr)!=7287: raise RuntimeError('row count')
          if any(a[0]!=b[0] for a,b in zip(er,rr)): raise RuntimeError('key order')
          def nums(s): return Counter(re.findall(r'(?<![\w])[-+]?(?:\d+(?:\.\d+)?|\.\d+)',s))
          def ph(s): return Counter(re.findall(r'\{\{?[^{}]+\}\}?',s))
          def act(s): return Counter(re.findall(r'\[action:[^\]]+\]',s))
          def colors(s): return len(re.findall(r'\[(?:[0-9A-Fa-f]{6}|decea3)\]',s))
          for (k,e),(_,r) in zip(er,rr):
              if k not in R: continue
              if nums(e)!=nums(r) or ph(e)!=ph(r) or act(e)!=act(r) or colors(e)!=colors(r) or e.count('[-]')!=r.count('[-]') or e.count(r'\n')!=r.count(r'\n'):
                  raise RuntimeError('syntax mismatch: '+k)
          RU.write_text('\n'.join(nm+tail)+'\n',encoding='utf-8',newline='\n')
          with REVIEW.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f,lineterminator='\n'); w.writerow(['номер','ключ','Английское содержание','Русское']); n=1
              for (k,e),(_,r) in zip(er,rr): w.writerow([n,k,e,r]); n+=1
              for l in tail:
                  p=parse(l)
                  if p: w.writerow([n,p[0],'',p[1]]); n+=1
          print('reviewed/new',len(R),'rows',len(rr),'tail',sum(bool(parse(x)) for x in tail))
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt V2.6/TRANSLATION_REVIEW_V2.6.csv
          git commit -m "Update Russian localization and review translation quality"
          git push origin HEAD:main
