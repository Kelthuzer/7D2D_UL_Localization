name: Apply Tinkerer terminology fix

on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-russian-review.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Tinkerer terminology
        shell: bash
        run: |
          set -euo pipefail
          RU="V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt"
          test "$(git hash-object "$RU")" = "b26c0b226e618b36747f954c776fb0c8d63d1a33"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'armorNerdOutfit,"Костюм мастера"': 'armorNerdOutfit,"Костюм ботана"',
              'armorNerdGloves,"Перчатки мастера"': 'armorNerdGloves,"Перчатки ботана"',
              'armorNerdBoots,"Ботинки мастера"': 'armorNerdBoots,"Ботинки ботана"',
              'researchArmorMediumT1,"Броня мастера"': 'researchArmorMediumT1,"Броня ботана"',
              'researchArmorMediumT1Desc,"Научитесь создавать броню мастера 1-го уровня. Комплект состоит из средней кепки, среднего костюма и средних перчаток, а также тяжёлых ботинок."': 'researchArmorMediumT1Desc,"Научитесь создавать броню ботана 1-го уровня. Комплект состоит из средней кепки, среднего костюма и средних перчаток, а также тяжёлых ботинок."',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-russian-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt .github/workflows/apply-russian-review.yml
          git diff --cached --check
          git commit -m "Use Botан terminology for Tinkerer armor"
          git push origin HEAD:main
