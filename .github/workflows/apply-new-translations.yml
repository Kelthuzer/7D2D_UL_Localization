name: Apply latest Russian translations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-new-translations.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Russian localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict, deque
          import subprocess

          EN = Path('V2.6/Mods/UndeadLegacy/Config/Localization/English.txt')
          RU = Path('V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt')
          MARKER = 'DOWN_VANILA_FIX_REMEBER_COPY'
          EXPECTED_EN_BLOB = '7064578df7b64bfba694a82ef5c9b8f3c8cf3737'
          EXPECTED_RU_BLOB = '65bba7b56eef9ea3313e5118d1b8a31fba5fc16b'

          translations = {
              'ulmBuffPollutedAirTooltip': 'Воздух слишком загрязнён, чтобы дышать без противогаза или работающего поблизости очистителя воздуха!',
              'skillTreeSniperPenetrationDesc': '[decea3]{0}[-] к пробитию целей снайперской винтовкой.\\nТребуются бронебойные патроны.',
              'challengeDesertGatherGear': 'Соберите предметы в Пустыне',
              'challengeDesertGatherGearShort': 'Соберите несколько предметов в Пустыне.',
              'challengeDesertGatherGearDesc': 'В Пустыне можно найти несколько полезных предметов. Соберите их и выполните все испытания в Пустыне.',
              'challengeSnowGatherGear': 'Соберите предметы в Снежном биоме',
              'challengeSnowGatherGearShort': 'Соберите несколько предметов в Снежном биоме.',
              'challengeSnowGatherGearDesc': 'В Снежном биоме можно найти несколько полезных предметов. Соберите их и выполните все испытания в Снежном биоме.',
              'wastelandSurvivalGatherGear': 'Соберите предметы в Пустоши',
              'challengeWastelandGatherGearShort': 'Соберите несколько предметов в Пустоши.',
              'challengeWastelandGatherGearDesc': 'В Пустоши можно найти несколько полезных предметов. Соберите их и выполните все испытания в Пустоши.',
          }

          def blob(path):
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          if blob(EN) != EXPECTED_EN_BLOB:
              raise SystemExit(f'English.txt changed while preparing update: {blob(EN)}')
          if blob(RU) != EXPECTED_RU_BLOB:
              raise SystemExit(f'Russian.txt changed while preparing update: {blob(RU)}')

          def key_of(line):
              return line.split(',', 1)[0].lstrip('\ufeff')

          def quote(value):
              return '"' + value.replace('"', '""') + '"'

          en_lines = EN.read_text(encoding='utf-8-sig').splitlines()
          ru_lines = RU.read_text(encoding='utf-8-sig').splitlines()

          marker_idx = next((i for i, line in enumerate(ru_lines) if line.startswith(MARKER + ',')), None)
          if marker_idx is None:
              raise SystemExit('Protected override marker not found')

          ru_main = ru_lines[:marker_idx]
          tail = ru_lines[marker_idx:]
          original_tail = list(tail)

          groups = defaultdict(deque)
          for line in ru_main[1:]:
              if not line.strip():
                  continue
              if ',' not in line:
                  raise SystemExit(f'Malformed Russian row: {line!r}')
              groups[key_of(line)].append(line)

          new_main = ['Key,russian']
          added = []
          changed = []
          used = set()

          for line in en_lines[1:]:
              if not line.strip():
                  new_main.append('')
                  continue
              if ',' not in line:
                  raise SystemExit(f'Malformed English row: {line!r}')
              key = key_of(line)
              old = groups[key].popleft() if groups[key] else None
              if key in translations:
                  used.add(key)
                  new = f'{key},{quote(translations[key])}'
                  new_main.append(new)
                  if old is None:
                      added.append(key)
                  elif old != new:
                      changed.append(key)
              else:
                  if old is None:
                      raise SystemExit(f'Missing Russian translation for new key: {key}')
                  new_main.append(old)

          unused = set(translations) - used
          if unused:
              raise SystemExit('Translation keys not found in English: ' + ', '.join(sorted(unused)))

          leftovers = [(k, list(v)) for k, v in groups.items() if v]
          if leftovers:
              raise SystemExit('Unexpected Russian rows absent from English main block: ' + ', '.join(k for k, _ in leftovers[:20]))
          if tail != original_tail:
              raise SystemExit('Protected override tail changed')

          en_keys = [key_of(x) for x in en_lines[1:] if x.strip()]
          ru_keys = [key_of(x) for x in new_main[1:] if x.strip()]
          if en_keys != ru_keys:
              raise SystemExit('Russian main key order does not exactly match English')

          if set(added) != {
              'ulmBuffPollutedAirTooltip',
              'challengeDesertGatherGear', 'challengeDesertGatherGearShort', 'challengeDesertGatherGearDesc',
              'challengeSnowGatherGear', 'challengeSnowGatherGearShort', 'challengeSnowGatherGearDesc',
              'wastelandSurvivalGatherGear', 'challengeWastelandGatherGearShort', 'challengeWastelandGatherGearDesc',
          }:
              raise SystemExit('Unexpected set of added keys: ' + ', '.join(added))
          if changed != ['skillTreeSniperPenetrationDesc']:
              raise SystemExit('Unexpected changed keys: ' + ', '.join(changed))

          RU.write_text('\n'.join(new_main + tail) + '\n', encoding='utf-8', newline='\n')
          print('Added:', len(added))
          print('Changed:', len(changed))
          PY

      - name: Commit translation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-new-translations.yml
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt
          git commit -m 'Translate latest English localization changes'
          git push origin HEAD:main
