name: Apply latest Russian translations

on:
  push:
    paths:
      - .github/workflows/apply-latest-translations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Russian localization
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          en_path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/English.txt')
          ru_path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt')

          EXPECTED_EN_BLOB = 'e9403b38224a4ffdda750d807baec354c248e821'
          EXPECTED_RU_BLOB = '8f0e08b6b523846a04309f212f1578ff8156f0e9'

          def blob_sha(path):
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          if blob_sha(en_path) != EXPECTED_EN_BLOB:
              raise SystemExit('English.txt changed since translation was prepared')
          if blob_sha(ru_path) != EXPECTED_RU_BLOB:
              raise SystemExit('Russian.txt changed since translation was prepared')

          updates = {
              'toolBellowsDesc': 'Помогает лучше управлять воздушным потоком в горне и повышает скорость изготовления.',
              'skillTreeDoubleJump3Desc': r'[decea3]{0}[-] к снижению расхода выносливости при прыжках\n[decea3]{1}[-] к снижению расхода выносливости при двойном прыжке\n[decea3]{2}[-] к высоте двойного прыжка\n[decea3]{3}[-] к безопасной высоте падения\n[decea3]Падение с высоты почти вдвое выше безопасной не приведёт к перелому ноги[-]',
              'skillTreeDoubleJump4Desc': r'[decea3]{0}[-] к снижению расхода выносливости при прыжках\n[decea3]{1}[-] к снижению расхода выносливости при двойном прыжке\n[decea3]{2}[-] к высоте двойного прыжка\n[decea3]{3}[-] к безопасной высоте падения\n[decea3]Падение с высоты почти вдвое выше безопасной не приведёт к растяжению или перелому ноги[-]',
          }

          dye_desc = 'На любой предмет или транспортное средство с косметическим слотом можно установить краситель, изменяющий его оттенок. Краситель устанавливается в косметический слот в окне модификации предмета.'

          insert_after = {
              'statReduceWeightBeltOreWood': [
                  ('statSafeFallDistance', 'Безопасная высота падения'),
              ],
              'statBlocksLight': [
                  ('statBonusSkillPoints', 'Бонусные очки навыков'),
              ],
              'statCraftingSpeed': [
                  ('statCraftingSmeltTime', 'Скорость плавки в печи'),
              ],
              'matResearchTools': [
                  ('matTitanium', 'Титан'),
              ],
              'modArmorWaterPurifier': [
                  ('modDyeGreen', 'Краситель (зелёный)'),
                  ('modDyeGreenDesc', dye_desc),
                  ('modDyeBlack', 'Краситель (чёрный)'),
                  ('modDyeBlackDesc', dye_desc),
                  ('modDyeBrown', 'Краситель (коричневый)'),
                  ('modDyeBrownDesc', dye_desc),
                  ('modDyeRed', 'Краситель (красный)'),
                  ('modDyeRedDesc', dye_desc),
                  ('modDyeOrange', 'Краситель (оранжевый)'),
                  ('modDyeOrangeDesc', dye_desc),
                  ('modDyeYellow', 'Краситель (жёлтый)'),
                  ('modDyeYellowDesc', dye_desc),
                  ('modDyeBlue', 'Краситель (синий)'),
                  ('modDyeBlueDesc', dye_desc),
                  ('modDyePurple', 'Краситель (фиолетовый)'),
                  ('modDyePurpleDesc', dye_desc),
                  ('modDyePink', 'Краситель (розовый)'),
                  ('modDyePinkDesc', dye_desc),
              ],
              'ulmResourceSiliconDesc': [
                  ('ulmResourceSkillPointBookFragment', 'Фрагмент Книги знаний'),
                  ('ulmResourceSkillPointBookFragmentDesc', 'Ценный фрагмент Книги знаний, который при прочтении навсегда увеличивает количество очков навыков на [decea3]1[-].'),
              ],
              'ulmBookMaintenanceHelicopterDesc': [
                  ('ulmBookSkillPoint', 'Книга знаний'),
                  ('ulmBookSkillPointDesc', r'Прочтение этой книги навсегда увеличит количество ваших очков навыков на [decea3]1[-], позволяя изучить больше навыков.\n\nОднако одними книгами можно научиться лишь до определённого предела, поэтому эффект ограничен: после достижения лимита получить дополнительные бонусные очки навыков из этой книги больше нельзя.'),
              ],
              'ulmToolMoldIngotDesc': [
                  ('ulmToolMoldRebar', 'Форма для арматуры'),
                  ('ulmToolMoldRebarDesc', 'Форма, в которой жидкий металл застывает в арматурные прутья.'),
              ],
              'ulmGeneratorBatteryCar': [
                  ('ulmGeneratorBatteryCarDesc', 'Переоборудованный автомобильный аккумулятор, который можно подключить к электросети для хранения излишков выработанной энергии. При необходимости он автоматически отдаёт накопленную энергию.'),
              ],
              'ulmGeneratorBatterySingle': [
                  ('ulmGeneratorBatterySingleDesc', 'Аккумулятор высокой ёмкости, способный хранить и отдавать приличное количество энергии. Его можно подключить к электросети для хранения излишков выработанной энергии, а при необходимости он автоматически отдаёт накопленную энергию.'),
              ],
              'ulmGeneratorBatteryCluster': [
                  ('ulmGeneratorBatteryClusterDesc', 'Блок из 6 аккумуляторов высокой ёмкости, который можно подключить к электросети для хранения большого количества излишков выработанной энергии. При необходимости он автоматически отдаёт накопленную энергию.'),
              ],
              'ulmGeneratorGasoline_1': [
                  ('ulmGeneratorGasoline_1Desc', 'Очень маленький базовый бензиновый генератор, способный вырабатывать небольшое количество энергии.'),
              ],
              'ulmGeneratorGasoline_2': [
                  ('ulmGeneratorGasoline_2Desc', 'Компактный бензиновый генератор с небольшой выходной мощностью.'),
              ],
              'ulmGeneratorGasoline_2b': [
                  ('ulmGeneratorGasoline_2bDesc', 'Компактный турбированный бензиновый генератор со средней выходной мощностью.'),
              ],
              'ulmGeneratorGasoline_3': [
                  ('ulmGeneratorGasoline_3Desc', 'Средний бензиновый генератор, способный обеспечить приличную выходную мощность.'),
              ],
              'ulmGeneratorGasoline_4': [
                  ('ulmGeneratorGasoline_4Desc', 'Средний бензиновый турбогенератор, обеспечивающий хорошую и стабильную выходную мощность.'),
              ],
              'ulmGeneratorGasoline_5': [
                  ('ulmGeneratorGasoline_5Desc', 'Большой бензиновый генератор стандартного промышленного размера с очень простой, но надёжной конструкцией.'),
              ],
              'ulmGeneratorGasoline_6': [
                  ('ulmGeneratorGasoline_6Desc', 'Большой бензиновый турбогенератор с компактной и качественной конструкцией, способный выдавать очень высокую мощность.'),
              ],
              'ulmGeneratorGasoline_7': [
                  ('ulmGeneratorGasoline_7Desc', 'Бензиновый генератор с циклотронным реактором — новейшая экспериментальная разработка, способная вырабатывать огромное количество энергии ценой очень высокого расхода топлива.'),
              ],
              'ulmGeneratorSolarScrap': [
                  ('ulmGeneratorSolarScrapDesc', 'Немного металлолома, проводов и солнечных элементов — и у вас будут свои первые солнечные панели начального уровня!'),
              ],
              'ulmGeneratorSolarSmall': [
                  ('ulmGeneratorSolarSmallDesc', 'Очень маленькая и компактная солнечная батарея. Её мощность невелика, зато такие батареи можно масштабировать и соединять между собой в любом количестве.'),
              ],
              'ulmGeneratorSolarMedium': [
                  ('ulmGeneratorSolarMediumDesc', 'Она вдвое больше компактной солнечной батареи и способна выдавать больше энергии, пока светит солнце.'),
              ],
              'ulmGeneratorSolarLarge': [
                  ('ulmGeneratorSolarLargeDesc', 'Хороший баланс мощности и размера: эта солнечная батарея способна стабильно снабжать электросеть энергией в солнечное время суток.'),
              ],
              'ulmGeneratorSolarXL': [
                  ('ulmGeneratorSolarXLDesc', 'Очень большая солнечная батарея, способная выдавать солидную мощность при солнечном свете и соперничать даже с некоторыми бензиновыми генераторами!'),
              ],
              'ulmGeneratorWindSmall': [
                  ('ulmGeneratorWindSmallDesc', 'Выглядит так, будто вот-вот развалится, но при некоторой удаче может стабильно вырабатывать небольшое количество энергии, используя силу ветра!'),
              ],
              'ulmGeneratorWindMedium': [
                  ('ulmGeneratorWindMediumDesc', 'Благодаря обтекаемой конструкции, прочной сборке и длинным лопастям эта ветряная турбина способна вырабатывать приличное количество энергии.'),
              ],
              'ulmGeneratorWindLarge': [
                  ('ulmGeneratorWindLargeDesc', 'Если места мало, эта турбина с вертикальной конструкцией — вероятно, то что нужно. Она способна вырабатывать приличное количество энергии.'),
              ],
              'ulmGeneratorWindXL': [
                  ('ulmGeneratorWindXLDesc', 'Очень большая и громоздкая ветряная турбина, зато она выдаёт высокую мощность ценой большой занимаемой площади.'),
              ],
          }

          def get_key(line):
              raw = line.rstrip(b'\r\n')
              if not raw or b',' not in raw:
                  return None
              return raw.split(b',', 1)[0].decode('utf-8-sig')

          def encode_line(key, value, nl):
              if '"' in value:
                  raise SystemExit(f'Unexpected quote in translation for {key}')
              return f'{key},"{value}"'.encode('utf-8') + nl

          en_data = en_path.read_bytes()
          ru_data = ru_path.read_bytes()
          bom = b'\xef\xbb\xbf' if ru_data.startswith(b'\xef\xbb\xbf') else b''
          body = ru_data[len(bom):]
          lines = body.splitlines(keepends=True)
          nl = b'\r\n' if any(x.endswith(b'\r\n') for x in lines[:20]) else b'\n'

          marker = 'DOWN_VANILA_FIX_REMEBER_COPY'
          tail_idx = next((i for i, line in enumerate(lines) if get_key(line) == marker), None)
          if tail_idx is None:
              raise SystemExit('Protected override marker not found')

          main = lines[:tail_idx]
          tail = b''.join(lines[tail_idx:])
          tail_hash = hashlib.sha256(tail).hexdigest()

          main_keys = [get_key(x) for x in main]
          inserted = [key for items in insert_after.values() for key, _ in items]

          for key in updates:
              if main_keys.count(key) != 1:
                  raise SystemExit(f'Expected exactly one existing RU key: {key}')
          for key in inserted:
              if key in main_keys:
                  raise SystemExit(f'New RU key already exists: {key}')
          for anchor in insert_after:
              if main_keys.count(anchor) != 1:
                  raise SystemExit(f'Expected exactly one insertion anchor: {anchor}')

          en_lines = en_data.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n').split('\n')
          en_keys = [line.split(',', 1)[0] for line in en_lines if line and ',' in line and not line.startswith('Key,')]
          for key in inserted + list(updates):
              if en_keys.count(key) != 1:
                  raise SystemExit(f'Expected exactly one English key: {key}')

          out = []
          for line in main:
              key = get_key(line)
              if key in updates:
                  out.append(encode_line(key, updates[key], nl))
              else:
                  out.append(line)
              if key in insert_after:
                  out.extend(encode_line(k, v, nl) for k, v in insert_after[key])

          patched_keys = [get_key(x) for x in out]
          patched_data_keys = [k for k in patched_keys if k and k != 'Key']
          if patched_data_keys != en_keys:
              for i, (rk, ek) in enumerate(zip(patched_data_keys, en_keys)):
                  if rk != ek:
                      raise SystemExit(f'Key order mismatch at {i}: RU={rk} EN={ek}')
              raise SystemExit(f'Key count mismatch: RU={len(patched_data_keys)} EN={len(en_keys)}')

          new_data = bom + b''.join(out) + tail
          new_tail_idx = new_data.find(marker.encode('utf-8'))
          if new_tail_idx < 0:
              raise SystemExit('Protected override tail disappeared')
          if hashlib.sha256(new_data[new_tail_idx:]).hexdigest() != tail_hash:
              raise SystemExit('Protected override tail changed')

          ru_path.write_bytes(new_data)
          print(f'Inserted {len(inserted)} new translations and updated {len(updates)} existing translations')
          print(f'English/Russian main key count: {len(en_keys)}')
          print(f'Protected tail SHA-256: {tail_hash}')

      - name: Commit translation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-latest-translations.yml
          git add V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt .github/workflows/apply-latest-translations.yml
          git commit -m "Translate latest Subquake localization changes"
          git push origin HEAD:main
