name: Fix Russian localization spacing

on:
  push:
    branches:
      - main
    paths:
      - 'V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt'
      - '.github/workflows/fix-russian-spacing.yml'

permissions:
  contents: write

jobs:
  fix-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize UI boundary spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path('V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt')
          text = path.read_text(encoding='utf-8-sig')
          lines = text.splitlines()

          values = {
              'uiCraftedIn': 'Создается в ',
              'ui_door_prefix': ' (',
              'uiGrowing': 'Растет ',
              'uiIngredientHave': ', В наличии: ',
              'uiIngredientNeed': r'\nНужно: ',
              'uiIngredientRetrieve': r'\nМожно извлечь: ',
              'uiScrappedIn': 'Разбирается на ',
              'uiSPCostNext': 'Следующий уровень: ',
              'uiSpeedKMH': ' КМ/Ч',
              'uiSpeedMPH': ' миль/ч',
              'optPOITierLootScale': 'Множитель лута от уровня POI',
              'gunPistolDesc': 'базовая пистолет разработан с помощью Kiloton баллистика для Стандартный гражданский использовать. требуется журнал к функция.',
              'ulmShippingContainerDoorGreen': 'Дверь контейнера',
              'ulmShippingContainerDoorBlue': 'Дверь контейнера',
              'ulmQuestTutorial03': 'Первое оружие',
          }

          changed = []
          result = []
          for line in lines:
              if ',' in line:
                  key = line.split(',', 1)[0]
                  if key in values:
                      new_line = f'{key},"{values[key]}"'
                      if line != new_line:
                          changed.append(key)
                          line = new_line
              result.append(line)

          path.write_text('\n'.join(result) + '\n', encoding='utf-8', newline='\n')
          print(f'Changed {len(changed)} entries: {", ".join(changed)}')

      - name: Commit correction if needed
        shell: bash
        run: |
          set -euo pipefail
          FILE='V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt'
          if git diff --quiet -- "$FILE"; then
            echo 'No spacing corrections needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Fix Russian localization UI spacing'
          git push origin HEAD:main
