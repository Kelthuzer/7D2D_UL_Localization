name: Sync Subquake upstream localization

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-subquake-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gitlab.com/subquakesgroup/UndeadLegacyExperimentalPart1.git"
          NEW="$(git ls-remote "$URL" refs/heads/main | awk '{print $1}')"
          OLD="$(tr -d '\r\n ' < .github/subquake-upstream.sha)"
          [[ "$NEW" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Subquake main unchanged: $NEW"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Subquake main changed: $OLD -> $NEW"
          fi

      - name: Download changed English.txt
        if: steps.upstream.outputs.changed == 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://gitlab.com/subquakesgroup/UndeadLegacyExperimentalPart1/-/raw/${SHA}/Mods/UndeadLegacy/Config/Localization/English.txt" \
            -o /tmp/English.txt

      - name: Validate and synchronize
        if: steps.upstream.outputs.changed == 'true'
        id: sync
        shell: python
        run: |
          from pathlib import Path

          src = Path('/tmp/English.txt').read_bytes()
          dst = Path('V2.6/Mods/UndeadLegacy/Config/Localization/English.txt')

          def norm(data):
              return data.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')

          upstream = norm(src)
          current = norm(dst.read_bytes())
          if not upstream.startswith('Key,English\n'):
              raise SystemExit('Invalid English.txt header')
          if len(upstream.splitlines()) < 5000 or len(src) < 300000:
              raise SystemExit('Downloaded English.txt looks incomplete')

          changed = upstream != current
          if changed:
              dst.write_text('\ufeff' + upstream, encoding='utf-8', newline='\n')

          Path('.github/subquake-upstream.sha').write_text('${{ steps.upstream.outputs.sha }}\n', encoding='ascii')
          with open(Path('${GITHUB_OUTPUT}'), 'a', encoding='utf-8') as f:
              f.write(f'english_changed={str(changed).lower()}\n')

      - name: Commit checked revision
        if: steps.upstream.outputs.changed == 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          ENGLISH_CHANGED: ${{ steps.sync.outputs.english_changed }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/subquake-upstream.sha
          if [ "$ENGLISH_CHANGED" = "true" ]; then
            git add V2.6/Mods/UndeadLegacy/Config/Localization/English.txt
            MSG="Update English.txt from Subquake ${SHA:0:12}"
          else
            MSG="Track Subquake upstream ${SHA:0:12}"
          fi
          git commit -m "$MSG" -m "Upstream commit: $SHA"
          git push origin HEAD:main

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Subquake upstream localization"
            echo
            echo "Current GitLab main: \`${{ steps.upstream.outputs.sha }}\`"
            if [ "${{ steps.upstream.outputs.changed }}" = "false" ]; then
              echo
              echo "Commit unchanged — English.txt was not downloaded."
            else
              echo
              echo "New upstream commit checked. English changed: \`${{ steps.sync.outputs.english_changed }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
