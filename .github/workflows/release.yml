name: Build Russian localization release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Undead Legacy Experimental version, e.g. v2.7.23"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          git check-ref-format "refs/tags/${VERSION}"
          echo "TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=UndeadLegacy_Russian.zip" >> "$GITHUB_ENV"
          echo "INSTALLER_NAME=Install_Russian_Translation.bat" >> "$GITHUB_ENV"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("V2.6/Mods/UndeadLegacy/Config/Localization/Russian.txt")
          archive = Path(os.environ["ZIP_NAME"])
          archive_path = "Mods/UndeadLegacy/Config/Localization/Russian.txt"

          if not source.is_file():
              raise SystemExit(f"Source file not found: {source}")

          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as zf:
              zf.write(source, archive_path)

          with ZipFile(archive, "r") as zf:
              names = zf.namelist()
              if names != [archive_path]:
                  raise SystemExit(f"Unexpected archive contents: {names}")
              if zf.read(archive_path) != source.read_bytes():
                  raise SystemExit("Russian.txt inside ZIP differs from repository source")

          print(f"Built {archive} ({archive.stat().st_size} bytes)")
          print(f"Archive path: {archive_path}")
          PY

      - name: Validate installer
        shell: bash
        run: |
          set -euo pipefail
          test -s "${INSTALLER_NAME}"
          grep -Fq "releases/latest/download/UndeadLegacy_Russian.zip" "${INSTALLER_NAME}"
          echo "Installer: ${INSTALLER_NAME}"

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${EXISTING_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists on ${EXISTING_SHA}, current commit is ${GITHUB_SHA}. Use the current Undead Legacy version tag."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Русская локализация для экспериментальной версии Undead Legacy ${TAG}.

          **Быстрая установка / обновление:** скачайте \`Install_Russian_Translation.bat\` и запустите его. BAT сам найдёт игру и установит последнюю версию перевода.

          **Ручная установка:** распакуйте \`UndeadLegacy_Russian.zip\` непосредственно в корневую папку \`7 Days To Die\`.

          После распаковки файл должен находиться по пути:
          \`7 Days To Die\\Mods\\UndeadLegacy\\Config\\Localization\\Russian.txt\`

          **Постоянная ссылка на последнюю локализацию:**
          \`https://github.com/Kelthuzer/7D2D_UL_Localization/releases/latest/download/UndeadLegacy_Russian.zip\`

          **Постоянная ссылка на установщик:**
          \`https://github.com/Kelthuzer/7D2D_UL_Localization/releases/latest/download/Install_Russian_Translation.bat\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Undead Legacy ${TAG} — Russian Localization"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP_NAME}" "${INSTALLER_NAME}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --latest
          else
            gh release create "${TAG}" "${ZIP_NAME}" "${INSTALLER_NAME}" --title "${TITLE}" --notes-file release-notes.md --latest
          fi

      - name: Show result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Release: $(gh release view "${TAG}" --json url -q .url)"
          echo "Title: Undead Legacy ${TAG} — Russian Localization"
          echo "Archive asset: ${ZIP_NAME}"
          echo "Installer asset: ${INSTALLER_NAME}"
          echo "Stable archive: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${ZIP_NAME}"
          echo "Stable installer: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${INSTALLER_NAME}"
          echo "ZIP contains only: Mods/UndeadLegacy/Config/Localization/Russian.txt"
